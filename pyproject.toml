[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avocado-mcp"
dynamic = ["version"]
description = "MCP server for the avocado-web (BookMeBus core) project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
avocado-mcp = "avocado_mcp.server:main"

# Single source of truth for the version: read it from the package __init__.
# pyproject does NOT hardcode a version, so it can never drift from code.
[tool.hatch.version]
path = "src/avocado_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/avocado_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
